<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRECW Smart Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">MRECW · FULL-STACK STARTER</p>
      <h1>Smart Task Manager</h1>
      <p class="subtitle">A simple demo connecting HTML, CSS, JavaScript, Node.js, Express and Supabase.</p>
    </header>

    <section class="panel">
      <h2>Add a task</h2>
      <form id="task-form">
        <label for="task-title">Task title</label>
        <div class="form-row">
          <input id="task-title" name="title" maxlength="120" placeholder="e.g. Prepare project presentation" required>
          <button type="submit">Add task</button>
        </div>
      </form>
      <p id="status" role="status" class="status">Connecting to the backend…</p>
    </section>

    <section class="panel">
      <div class="list-heading">
        <h2>Your tasks</h2>
        <button id="refresh-btn" class="secondary" type="button">Refresh</button>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-state" class="empty">No tasks yet. Add your first task above.</p>
    </section>

    <footer>Training demo · Do not store sensitive information</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
